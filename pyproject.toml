[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "higgsfold"
version = "0.3.0"
description = "Soliton and local-topology analysis of protein backbones (discrete Frenet frames, Z2 gauge, perestroikas)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["numpy", "scipy", "matplotlib", "gemmi"]

# numba is optional but makes fitting ~100x faster

[project.optional-dependencies]
md = ["MDAnalysis"]
fast = ["numba"]
dev = ["pytest"]

[project.scripts]
higgsfold = "higgsfold.cli:main"

[tool.setuptools]
packages = ["higgsfold"]
